  <div class="outer-container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-link active" data-tab="first-four">First Four</button>
      <button class="tab-link" data-tab="round-64">Round of 64</button>
      <button class="tab-link" data-tab="round-32">Round of 32</button>
      <button class="tab-link" data-tab="sweet-sixteen">Sweet Sixteen</button>
      <button class="tab-link" data-tab="elite-eight">Elite Eight</button>
      <button class="tab-link" data-tab="final-four">Final Four</button>
      <button class="tab-link" data-tab="national-championship">Championship</button>
    </div>

   <div id="first-four" class="tab-content"><div class="games-wrapper"></div></div>
<div id="round-64" class="tab-content"><div class="games-wrapper"></div></div>
<div id="round-32" class="tab-content"><div class="games-wrapper"></div></div>
<div id="sweet-sixteen" class="tab-content"><div class="games-wrapper"></div></div>
<div id="elite-eight" class="tab-content"><div class="games-wrapper"></div></div>
<div id="final-four" class="tab-content"><div class="games-wrapper"></div></div>
<div id="national-championship" class="tab-content"><div class="games-wrapper"></div></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  fetch("games.json")
    .then(res => res.json())
    .then(games => {

      const roundMap = {
        "First Four": "first-four",
        "Round of 64": "round-64",
        "Round of 32": "round-32",
        "Sweet Sixteen": "sweet-sixteen",
        "Elite Eight": "elite-eight",
        "Final Four": "final-four",
        "National Championship": "national-championship"
      };

      games.forEach(game => {
        if (game.year !== 2025) return;

        const tabId = roundMap[game.round];
        if (!tabId) return;

        const wrapper = document.querySelector(`#${tabId} .games-wrapper`);

        const gameBox = document.createElement("div");
        gameBox.className = "game-box";

        gameBox.innerHTML = `
          <div class="jerseys">
            <img src="${game.awayJersey}" alt="Away Jersey">
            <img src="${game.homeJersey}" alt="Home Jersey">
          </div>

          <div class="game-info">
            <p class="round-name">${game.year} ${game.round}</p>

            <p class="score">
              ${game.awayTeam} - ${game.awayScore}
            </p>

            <p class="score">
              ${game.homeTeam} - ${game.homeScore}
            </p>

            <p class="datetime">
              ${game.date} - ${game.time}
            </p>

            <p class="details">
              ${game.city_state} / ${game.region}
            </p>
          </div>
        `;

        wrapper.appendChild(gameBox);
      });

    const activeTab = document.querySelector(".tab-link.active");
    if (activeTab) activeTab.click();

    });
});


</script>


  </div>

  <!-- JS for tab switching -->
  <script>
    const tabs = document.querySelectorAll('.tab-link');
    const contents = document.querySelectorAll('.tab-content');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // Remove active classes
        tabs.forEach(t => t.classList.remove('active'));
        contents.forEach(c => c.classList.remove('active'));
        // Add active to clicked tab and corresponding content
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });
  </script>

  <script>
  const dropdown = document.querySelector(".dropdown-container");
  const header = dropdown.querySelector(".dropdown-header");

  header.addEventListener("click", () => {
    dropdown.classList.toggle("active");
  });
</script>
